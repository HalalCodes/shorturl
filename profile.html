<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — ShortURL</title><link rel="stylesheet" href="style.css"></head><body data-page="profile"><main class="profile-shell"><header class="dash-head"><div><a class="brand" href="app.html"><span class="brand-mark">S</span><span>ShortURL</span></a><h1>Profile & settings</h1></div><a class="btn btn-ghost" href="app.html">← Dashboard</a></header><section class="card profile-card"><div class="profile-avatar avatar-xl" id="profileAvatar">S</div><div><h2 id="profileEmail">Not signed in</h2><p>Manage your public profile.</p></div><form id="profileForm"><label>Display name<input id="displayName" maxlength="60" placeholder="Your name"></label><label>Bio<textarea id="bio" maxlength="160" placeholder="Tell people about yourself"></textarea></label><label>Public username<input id="username" maxlength="30" pattern="[A-Za-z0-9_-]+" placeholder="omor"></label><button class="btn btn-primary" type="submit">Save profile</button><p id="profileMessage" class="form-message"></p></form></section></main><script type="module" src="app.js"></script></body></html>
